# deploy/cloudrun/secrets.example.toml
#
# Cloud Run Streamlit OIDC secrets template.
# Copy this file to `deploy/cloudrun/secrets.toml`, fill in real values,
# then upload it to Google Secret Manager as STREAMLIT_SECRETS_TOML.
# Do not commit the real `deploy/cloudrun/secrets.toml`.

[auth]
redirect_uri = "https://your-cloud-run-service-url/oauth2callback"
cookie_secret = "replace-with-a-long-random-string"

[auth.google]
client_id = "your-google-oauth-client-id"
client_secret = "your-google-oauth-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
